name: Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ControledefinancasPRO-APK
          path: bin/*.apk

      - name: Build AAB
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ControledefinancasPRO-AAB
          path: bin/*.aab