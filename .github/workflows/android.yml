name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          buildozer -v android debug > build.log 2>&1 || true

      - name: Upload Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log