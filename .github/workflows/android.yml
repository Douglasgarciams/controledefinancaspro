name: Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar Keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > controledefinancaspro-upload.jks

          mkdir -p .buildozer/android/platform/build-arm64-v8a/dists/financeiro

          cp controledefinancaspro-upload.jks \
            .buildozer/android/platform/build-arm64-v8a/dists/financeiro/

      - name: Build APK (Debug)
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-apk.log

      - name: Build AAB
        shell: bash
        env:
          P4A_RELEASE_KEYSTORE: .buildozer/android/platform/build-arm64-v8a/dists/financeiro/controledefinancaspro-upload.jks
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          buildozer android release

      - name: Mostrar arquivos gerados
        if: always()
        shell: bash
        run: |
          echo "================ APK ================"
          find . -type f -name "*.apk"

          echo "================ AAB ================"
          find . -type f -name "*.aab"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControledefinancasPRO-APK
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControledefinancasPRO-AAB
          path: "**/*.aab"
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            build-apk.log
            build-aab.log
          if-no-files-found: warn
          retention-days: 14